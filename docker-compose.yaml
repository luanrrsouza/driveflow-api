services:

  postgres:
    image: postgres:17
    container_name: driveflow-postgres

    environment:
      POSTGRES_DB: driveflow
      POSTGRES_USER: driveflow
      POSTGRES_PASSWORD: driveflow

    ports:
      - "5432:5432"

    volumes:
      - driveflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driveflow -d driveflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  driveflow-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: driveflow-api

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/driveflow
      DB_USER: driveflow
      DB_PASSWORD: driveflow
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://3.88.198.138"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  driveflow-web:
    build:
      context: ../driveflow-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://3.88.198.138:8080

    container_name: driveflow-web

    ports:
      - "80:80"

    depends_on:
      - driveflow-api

volumes:
  driveflow-postgres-data:
